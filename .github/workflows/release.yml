name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r '!src-dist/data/requirements.txt'

      - name: Run build script
        run: python '!src-dist/scripts/build.py'
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        
      - name: List output
        run: |
          dir
          dir output
        shell: cmd

      - name: Rename artifact
        run: |
          copy output\mergeDBM.jx3dat output\mergeDBM${{ github.ref_name }}.jx3dat
        shell: cmd

      - name: Upload GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: output/mergeDBM${{ github.ref_name }}.jx3dat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        